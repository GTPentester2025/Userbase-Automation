<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Userbase Automation — Pipeline Studio</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/><path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/></svg>
      </div>
      <div>
        <h1>Userbase Automation</h1>
        <div class="sub">Pipeline Studio</div>
      </div>
    </div>
    <div class="top-right">
      <button class="ghost-btn" id="home-btn" hidden>Runs</button>
      <div class="progress-pill" hidden id="pg-pill">
        <span class="count" id="pg-count">0 / 14</span>
        <span class="bar"><i id="pg-bar"></i></span>
      </div>
      <button class="ghost-btn" id="jump-latest" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg>
        Latest
      </button>
      <button class="ghost-btn" id="log-btn" title="Show activity log">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        Log <span class="log-badge" id="log-badge">0</span>
      </button>
    </div>
  </header>

  <div class="stage">
    <nav class="metro" aria-label="Pipeline stages" id="metro" hidden>
      <h2>Pipeline</h2>
      <div class="rail-line"></div>
      <ol id="stations"></ol>
    </nav>

    <section class="panel">
      <div class="busybar" id="busybar"><i></i></div>
      <div class="panel-inner" id="panel"></div>
    </section>
  </div>

  <section class="logdock" id="logdock" hidden>
    <div class="logdock-head">
      <h2>Activity log</h2>
      <span class="logdock-hint">every request, response and error — top to bottom</span>
      <div class="logdock-actions">
        <button class="ghost-btn" id="log-copy">Copy all</button>
        <button class="ghost-btn" id="log-clear">Clear</button>
        <button class="ghost-btn" id="log-hide">Hide</button>
      </div>
    </div>
    <div class="logbody mono" id="logbody"></div>
  </section>
</div>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
